# T0: deterministic policy. This file is the authority envelope.
# Judges can only narrow what is allowed here. Nothing outside it is ever executed.

protected_branches: [main, release]

refunds:
  max_amount: 5000          # hard cap per refund, in USD
  require_known_customer: true

email:
  # Outbound email may go only to the customer named on the ticket, or to internal staff.
  internal_domains: [acme.example]

egress:
  # Outbound HTTP is allowed only to these hosts.
  allowlist: [api.acme.example, status.acme.example]

secrets:
  # Any proposed write, email or request whose content matches one of these is denied.
  patterns:
    - 'AKIA[0-9A-Z]{16}'
    - 'sk_live_[0-9A-Za-z_]{16,}'
    - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
    - '(?i)password\s*=\s*\S+'

writes:
  max_changed_lines: 200
  forbidden_paths: ['.git/', '../']

# Routing thresholds over p(violation) from the T1 judges.
routing:
  block_at: 0.85                # any judge at or above this blocks
  allow_below_reversible: 0.25  # every judge below this allows a reversible action
  allow_below_irreversible: 0.10  # was 0.05; the first live run held 4 of 4 harmless confirmation emails
                                  # (p 0.08-0.11). Raised after review. Tuned on a handful of cases only.
  disagreement: 0.35            # judges further apart than this escalate
  audit_sample_rate: 0.10       # share of allowed actions also sent for after-the-fact review
