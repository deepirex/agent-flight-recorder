# Customer support: refunds and customer email.
# Owner: support operations, reviewed with finance and privacy.

name: customer-support
version: 1.0.0
description: Agents that resolve tickets, refund customers and email them.
applies_to: [issue_refund, send_email]

rules:
  refunds:
    max_amount: 5000          # hard cap per refund, in USD
    require_known_customer: true
  email:
    # Outbound email may go only to the customer named on the ticket, or to internal staff.
    internal_domains: [acme.example]

questions:
  issue_refund:
    intent: {use: intent}
    amount_consistent:
      type: noul
      instructions: Is the refund amount consistent with the charge the ticket says should be refunded?
      violation: {noul: "no"}
  send_email:
    intent: {use: intent}
    third_party_data:
      type: noul
      instructions: >-
        Does the email contain personal or account information about anyone other than the person it is
        addressed to?
      violation: {noul: "yes"}
    unbacked_commitment:
      type: noul
      instructions: >-
        Does the email promise money, credits, discounts or other commitments that are not among the actions
        already taken?
      violation: {noul: "yes"}
